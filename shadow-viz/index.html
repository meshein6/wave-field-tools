<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Scale ──────────────────────────────────────────────────────────────────
const PX = 5.0; // px per mm
const mm = v => v * PX;
const W = 860, H = 480;

// ── LED presets ────────────────────────────────────────────────────────────
const LED_PRESETS = [
  { name: "WS2812B",             angle: 120, note: "Lambertian, most common" },
  { name: "WS2815",             angle: 120, note: "12V version, same optics" },
  { name: "SK6812 RGBW",        angle: 120, note: "Lambertian + white channel" },
  { name: "APA102 / SK9822",    angle: 120, note: "High speed, same die optics" },
  { name: "WS2811 (bare)",      angle: 155, note: "Bare die, very wide" },
  { name: "Diffuse lens cap",   angle:  60, note: "Narrow secondary lens fitted" },
  { name: "Spot cap (narrow)",  angle:  30, note: "Tight collimating lens" },
  { name: "Custom",             angle: null, note: "Set manually below" },
];

const DEFAULTS = {
  ledSpacing:    16.7,
  wallGap:        6.0,
  wallThickness:  0.8,
  beamAngle:     120,
  presetIdx:       0,
  lensHeight:     35,
  wallHeight:     10,
};

// ── Physics ────────────────────────────────────────────────────────────────
function shadowShift(p) {
  const d = p.lensHeight - p.wallHeight;
  if (d <= 0) return Infinity;
  return (p.ledSpacing * p.wallHeight) / d;
}
function shiftRatio(p) { return shadowShift(p) / p.wallGap; }
function depthRatio(p)  { return p.wallHeight / p.lensHeight; }
function solidFill(p)   { return p.wallThickness / (p.wallGap + p.wallThickness); }
function minBeamHalf(p) { return (Math.atan2(p.ledSpacing * 1.5, p.lensHeight) * 180) / Math.PI; }

// Colour clarity: from the centre of a wall gap, a ray to an LED at dx
// passes the gap if |dx| * wallHeight / lensHeight < wallGap/2
// => max LED reach dx_max = (wallGap/2) * lensHeight / wallHeight
// This GROWS with lensHeight: farther diffuser = more crosstalk = lower clarity.
function colorClarity(p) {
  const halfBeam  = (p.beamAngle / 2) * (Math.PI / 180);
  const beamBleed = Math.tan(halfBeam) * p.lensHeight;
  if (p.wallHeight <= 0) {
    const clarity = Math.min(1, p.ledSpacing / (2 * beamBleed));
    return { clarity, leakage: 1 - clarity, effectiveBleed: beamBleed, beamBleed, wallBleed: Infinity, numContrib: Math.max(1, 2*beamBleed/p.ledSpacing) };
  }
  const wallBleed      = (p.wallGap / 2) * p.lensHeight / p.wallHeight;
  const effectiveBleed = Math.min(beamBleed, wallBleed);
  const clarity        = Math.min(1, p.ledSpacing / (2 * effectiveBleed));
  const leakage        = Math.max(0, 1 - clarity);
  const numContrib     = Math.max(1, (2 * effectiveBleed) / p.ledSpacing);
  return { clarity, leakage, effectiveBleed, beamBleed, wallBleed, numContrib };
}

function suggestOptimal(p) {
  const wH = +(p.lensHeight * 0.28).toFixed(1);
  const wG = +(p.ledSpacing * wH / ((p.lensHeight - wH) * 0.5)).toFixed(1);
  const wT = +Math.max(0.4, Math.min(1.5, wG * 0.14)).toFixed(1);
  return { ...p, wallHeight: wH, wallGap: Math.max(1, wG), wallThickness: wT };
}

// ── Colour helpers ─────────────────────────────────────────────────────────
const C = { good:"#10b981", warn:"#f59e0b", bad:"#ef4444", info:"#a855f7" };
const BG= { good:"rgba(16,185,129,0.08)", warn:"rgba(245,158,11,0.08)", bad:"rgba(239,68,68,0.08)", info:"rgba(124,58,237,0.08)" };

function rStat(r)  { return r<0.08?"bad":r<0.2?"warn":r<=0.85?"good":r<=1.4?"warn":"bad"; }
function dStat(d)  { return d<0.10?"bad":d<0.15?"warn":d<=0.45?"good":d<=0.55?"warn":"bad"; }
function fStat(f)  { return f<0.30?"good":f<0.44?"warn":"bad"; }
function clStat(c) { return c>0.80?"good":c>0.50?"warn":"bad"; }

// ── Sub-components ─────────────────────────────────────────────────────────
function Label({ children }) {
  return <div style={{ fontSize:9, color:"#7a7a8c", letterSpacing:"0.22em", textTransform:"uppercase", marginBottom:8 }}>{children}</div>;
}

function NumField({ label, value, min, max, step, onChange, unit="" }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#c4b5fd", textTransform:"uppercase", letterSpacing:"0.06em" }}>
        <span>{label}</span>
        <span style={{ color:"#c8e8f8", fontVariantNumeric:"tabular-nums" }}>{value}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(Number(e.target.value))}
        style={{ accentColor:"#a855f7", cursor:"pointer" }} />
      <input type="number" min={min} max={max} step={step} value={value}
        onChange={e=>{const v=Number(e.target.value); if(!isNaN(v)&&v>=min&&v<=max) onChange(v);}}
        style={{ background:"rgba(8,18,36,0.8)", border:"1px solid #2a2a32", borderRadius:3,
          color:"#c4b5fd", fontSize:11, padding:"3px 6px", width:"100%", boxSizing:"border-box",
          fontFamily:"Inter, system-ui, sans-serif" }} />
    </div>
  );
}

function HeightSlider({ label, value, min, max, step, onChange, unit="" }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:5, flex:1 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"#c4b5fd", textTransform:"uppercase", letterSpacing:"0.07em" }}>
        <span>{label}</span>
        <span style={{ color:"#f0f0f5", fontVariantNumeric:"tabular-nums", fontSize:13, fontWeight:700 }}>{value}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(Number(e.target.value))}
        style={{ accentColor:"#a855f7", cursor:"pointer" }} />
    </div>
  );
}

function Metric({ label, value, unit, status }) {
  return (
    <div style={{ background:BG[status], border:`1px solid ${C[status]}44`, borderRadius:5, padding:"7px 9px" }}>
      <div style={{ fontSize:8, color:"#7a7a8c", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:2 }}>{label}</div>
      <div style={{ fontSize:14, fontWeight:700, color:C[status], fontVariantNumeric:"tabular-nums", lineHeight:1 }}>
        {value}<span style={{ fontSize:9, marginLeft:2, opacity:0.7 }}>{unit}</span>
      </div>
    </div>
  );
}

function BarGauge({ value, max=1, status, label }) {
  const pct = Math.min(1, Math.max(0, value / max)) * 100;
  return (
    <div style={{ marginBottom:6 }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"#7a7a8c", marginBottom:3 }}>
        <span style={{ textTransform:"uppercase", letterSpacing:"0.08em" }}>{label}</span>
        <span style={{ color:C[status], fontWeight:700 }}>{(value*100).toFixed(0)}%</span>
      </div>
      <div style={{ background:"rgba(10,22,42,0.8)", borderRadius:3, height:6, overflow:"hidden", border:"1px solid #2a2a32" }}>
        <div style={{ width:`${pct}%`, height:"100%", background:C[status], borderRadius:3, transition:"width 0.2s" }} />
      </div>
    </div>
  );
}

// Fixed arc dial — largeArc flips at 2/3 of a 270° sweep (when arc > 180°)
function ScoreDial({ score, status, label, sublabel }) {
  const pct = Math.min(1, Math.max(0, score));
  const r = 36, cx = 50, cy = 52;
  const toXY = deg => {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const [x1,y1] = toXY(-135);
  const [x2,y2] = toXY(135);
  const angle = -135 + pct * 270;
  const [ex,ey] = toXY(angle);
  const [nx,ny] = toXY(angle);
  // largeArc must be 1 when arc span > 180°; 270° × pct > 180° → pct > 2/3
  const largeArc = pct > 2/3 ? 1 : 0;
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
      <svg width="100" height="70" viewBox="0 0 100 70">
        {/* background track */}
        <path d={`M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}`}
          fill="none" stroke="#2a2a32" strokeWidth={7} strokeLinecap="round"/>
        {/* filled arc */}
        {pct > 0.001 && (
          <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}`}
            fill="none" stroke={C[status]} strokeWidth={7} strokeLinecap="round"/>
        )}
        {/* needle dot */}
        <circle cx={nx} cy={ny} r={4} fill={C[status]}/>
        <text x={cx} y={cy-1} textAnchor="middle" fill={C[status]}
          fontSize="13" fontWeight="700" fontFamily="'JetBrains Mono',ui-monospace,monospace">
          {(pct*100).toFixed(0)}
        </text>
        <text x={cx} y={cy+10} textAnchor="middle" fill="#7a7a8c"
          fontSize="7" fontFamily="'JetBrains Mono',ui-monospace,monospace">%</text>
      </svg>
      <div style={{ fontSize:9, color:"#7a7a8c", textTransform:"uppercase", letterSpacing:"0.1em", textAlign:"center" }}>{label}</div>
      {sublabel && <div style={{ fontSize:8, color:"#7a7a8c", textAlign:"center" }}>{sublabel}</div>}
    </div>
  );
}

// Wobble zone strip — the shift ratio IS the visualisation, no separate score
// Zones: 0────0.08────0.25────0.85────1.4────2.0+
const ZONES = [
  { lo:0,    hi:0.08, label:"None",    color:"#ef4444" },
  { lo:0.08, hi:0.25, label:"Shimmer", color:"#f59e0b" },
  { lo:0.25, hi:0.85, label:"Optimal", color:"#10b981" },
  { lo:0.85, hi:1.40, label:"Busy",    color:"#f59e0b" },
  { lo:1.40, hi:2.00, label:"Chaotic", color:"#ef4444" },
];
const STRIP_MAX = 2.0;

// Per-zone visual descriptions: [bottom of band, top of band]
const ZONE_DESCRIPTIONS = {
  "None": [
    "The shadow grid is completely frozen. No movement at all — the walls produce fixed dark stripes and WLED effects have zero visible influence on the diffuser surface.",
    "Still essentially static. You might catch the faintest pulse if you stare closely, but to any casual observer the pattern doesn't move. The effect is decorative at best.",
  ],
  "Shimmer": [
    "Shadow edges begin to twitch very slightly in place — a subtle breathing rather than a sweep. There's no directional wave yet, just a soft texture that pulses as neighbouring LEDs brighten and dim.",
    "A gentle ripple is just starting to form. Edges shift a noticeable fraction of each gap but don't travel far enough to read as motion. Looks like a slow, quiet shimmer across the surface.",
  ],
  "Optimal": [
    "Smooth, liquid wave. Each shadow edge sweeps roughly a quarter of its gap per LED-to-LED transition, creating a calm rolling motion — like light reflecting off slowly moving water.",
    "Crisp, energetic sweep. Shadows travel nearly the full width of each gap before handing off to the next LED, producing a fast clean wave that reads clearly from a distance. This is the sweet spot for dramatic motion effects.",
  ],
  "Busy": [
    "Shadow edges begin to overshoot into adjacent gaps. Two shadow fronts may briefly share the same gap, creating a moment of double-banding. Still readable as motion but visibly complex and slightly restless.",
    "Multiple shadow fronts compete inside each gap simultaneously. The pattern resembles a rapid moiré — waves seem to travel in opposite directions at once. Visually intense and hard to follow as a single coherent sweep.",
  ],
  "Chaotic": [
    "Shadow boundaries from several LEDs overlap continuously. No clear directional wave survives — the diffuser surface appears to flash in irregular patches rather than sweep. The wall geometry is largely washed out.",
    "Complete visual noise. The diffuser flickers incoherently at high speed regardless of which WLED effect is running. Any spatial structure from the walls is invisible; it reads as random brightness variation.",
  ],
};

function RatioZoneStrip({ ratio }) {
  const clampedRatio = Math.min(ratio, STRIP_MAX);
  const needlePct = clampedRatio / STRIP_MAX;
  const activeZone = ZONES.find(z => ratio >= z.lo && ratio < z.hi) || ZONES[ZONES.length-1];

  // Position within the band 0→1
  const bandPos = activeZone ? Math.min(1, (ratio - activeZone.lo) / (activeZone.hi - activeZone.lo)) : 1;
  const descs = ZONE_DESCRIPTIONS[activeZone.label] || ["",""];
  // Interpolate which description to emphasise based on position in band
  const isLow  = bandPos < 0.35;
  const isHigh = bandPos > 0.65;
  const isMid  = !isLow && !isHigh;

  return (
    <div style={{ width:"100%", marginBottom:12 }}>
      {/* Zone header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:6 }}>
        <span style={{ fontSize:9, color:"#7a7a8c", textTransform:"uppercase", letterSpacing:"0.1em" }}>Shift Ratio Position</span>
        <span style={{ fontSize:14, fontWeight:700, color:activeZone.color, fontVariantNumeric:"tabular-nums" }}>
          {isFinite(ratio) ? ratio.toFixed(2) : "∞"}
          <span style={{ fontSize:10, marginLeft:4, opacity:0.8 }}>— {activeZone.label}</span>
        </span>
      </div>

      {/* Segmented colour bar */}
      <div style={{ position:"relative", height:18, borderRadius:4, overflow:"hidden", display:"flex", border:"1px solid #2a2a32" }}>
        {ZONES.map(z => {
          const w = ((z.hi - z.lo) / STRIP_MAX) * 100;
          return (
            <div key={z.label} style={{ width:`${w}%`, background:z.color+"28", borderRight:"1px solid #2a2a32",
              display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ fontSize:7, color:z.color+"cc", letterSpacing:"0.06em", textTransform:"uppercase", userSelect:"none" }}>{z.label}</span>
            </div>
          );
        })}
        {/* needle */}
        <div style={{
          position:"absolute", top:0, bottom:0,
          left:`calc(${needlePct*100}% - 1px)`,
          width:2, background:"#fff", borderRadius:1,
          boxShadow:`0 0 6px ${activeZone.color}`,
          transition:"left 0.15s",
        }}/>
      </div>

      {/* Tick labels */}
      <div style={{ position:"relative", height:14, marginTop:2, marginBottom:10 }}>
        {[0, 0.08, 0.25, 0.85, 1.4, 2.0].map(v => (
          <span key={v} style={{
            position:"absolute", left:`${(v/STRIP_MAX)*100}%`,
            transform:"translateX(-50%)", fontSize:7, color:"#7a7a8c",
            fontVariantNumeric:"tabular-nums",
          }}>{v}</span>
        ))}
      </div>

      {/* Visual description — updates live with position in band */}
      <div style={{ background:"#111114", border:`1px solid ${activeZone.color}22`,
        borderLeft:`2px solid ${activeZone.color}88`,
        borderRadius:4, padding:"9px 11px", fontSize:9.5, lineHeight:1.7, color:"#7ab8cc" }}>

        {/* Bottom-of-band description */}
        <div style={{ marginBottom: isMid||isHigh ? 7 : 0 }}>
          <span style={{ fontSize:8, color:activeZone.color+"99", textTransform:"uppercase",
            letterSpacing:"0.1em", display:"block", marginBottom:3 }}>
            {activeZone.lo === 0 ? "At this ratio:" : `Near ${activeZone.lo} (entering ${activeZone.label.toLowerCase()}):`}
          </span>
          <span style={{ color: isLow ? "#f0f0f5" : "#7a7a8c" }}>{descs[0]}</span>
        </div>

        {/* Top-of-band description — shown when not at bottom */}
        {activeZone.hi <= STRIP_MAX && (
          <div>
            <span style={{ fontSize:8, color:activeZone.color+"99", textTransform:"uppercase",
              letterSpacing:"0.1em", display:"block", marginBottom:3, marginTop: isMid||isHigh ? 0 : 7 }}>
              Near {activeZone.hi} (approaching {(ZONES.find(z=>z.lo===activeZone.hi)||{label:"limit"}).label.toLowerCase()}):
            </span>
            <span style={{ color: isHigh ? "#f0f0f5" : "#7a7a8c" }}>{descs[1]}</span>
          </div>
        )}
        {activeZone.hi > STRIP_MAX && (
          <div style={{ marginTop: isMid||isHigh ? 0 : 7 }}>
            <span style={{ fontSize:8, color:activeZone.color+"99", textTransform:"uppercase",
              letterSpacing:"0.1em", display:"block", marginBottom:3 }}>
              Above {activeZone.lo}:
            </span>
            <span style={{ color: isHigh ? "#f0f0f5" : "#7a7a8c" }}>{descs[1]}</span>
          </div>
        )}
      </div>
    </div>
  );
}

function dblArrow(ctx,x1,y1,x2,y2,col) {
  ctx.fillStyle=col; ctx.lineWidth=1; ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(x1-3,y1+5);ctx.lineTo(x1,y1);ctx.lineTo(x1+3,y1+5);ctx.fill();
  ctx.beginPath();ctx.moveTo(x2-3,y2-5);ctx.lineTo(x2,y2);ctx.lineTo(x2+3,y2-5);ctx.fill();
}
function App() {
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const [fixed, setFixed] = useState({
    ledSpacing:    DEFAULTS.ledSpacing,
    wallGap:       DEFAULTS.wallGap,
    wallThickness: DEFAULTS.wallThickness,
    beamAngle:     DEFAULTS.beamAngle,
    presetIdx:     DEFAULTS.presetIdx,
  });
  const [heights, setHeights] = useState({
    lensHeight: DEFAULTS.lensHeight,
    wallHeight: DEFAULTS.wallHeight,
  });

  const p = { ...fixed, ...heights };
  const setF = k => v => setFixed(prev => ({ ...prev, [k]: v }));
  const setH = k => v => setHeights(prev => ({ ...prev, [k]: v }));

  const shift  = shadowShift(p);
  const ratio  = shiftRatio(p);
  const depth  = depthRatio(p);
  const fill   = solidFill(p);
  const minAng = minBeamHalf(p);
  const beamOk = p.beamAngle / 2 >= minAng;
  const cc     = colorClarity(p);

  const selectPreset = idx => {
    const pr = LED_PRESETS[idx];
    setFixed(prev => ({ ...prev, presetIdx: idx, beamAngle: pr.angle ?? prev.beamAngle }));
  };

  // ── Canvas draw ──────────────────────────────────────────────────────────
  const draw = useCallback(ts => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    const ledSpPx  = mm(p.ledSpacing);
    const lensHPx  = mm(p.lensHeight);
    const wallHPx  = mm(p.wallHeight);
    const wallGPx  = mm(p.wallGap);
    const wallTPx  = mm(p.wallThickness);
    const pitchPx  = wallGPx + wallTPx;
    const ledY     = H - 46;
    const lensY    = ledY - lensHPx;
    const wallBotY = lensY + wallHPx;
    const diffH    = 24;

    if (lensY < 28) {
      ctx.fillStyle="#0a0a0c"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#ef4444"; ctx.font="11px monospace";
      ctx.fillText("Lens height too large for viewport — reduce it", 20, H/2);
      return;
    }

    const leds=[], lc=Math.ceil(W/ledSpPx)+4;
    for(let i=-Math.ceil(lc/2);i<=Math.ceil(lc/2);i++) leds.push(W/2+i*ledSpPx);

    const walls=[], wc=Math.ceil(W/pitchPx)+6, wOff=(W/2)%pitchPx;
    for(let i=-Math.ceil(wc/2);i<=Math.ceil(wc/2);i++) walls.push(wOff+i*pitchPx);

    const t = ts*0.001;
    const bright = leds.map((_,i)=>Math.max(0.04,
      0.6+0.45*(Math.sin(t+i*0.73)*0.5+Math.sin(t*1.31+i*1.2)*0.3+Math.sin(t*0.61+i*0.41)*0.2)
    ));

    ctx.fillStyle="#0a0a0c"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(42,42,50,0.35)"; ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    const halfBeam=(p.beamAngle/2)*Math.PI/180;
    const illum=new Float32Array(W);
    for(let x=0;x<W;x++){
      let tot=0;
      leds.forEach((lx,li)=>{
        if(lx<-140||lx>W+140) return;
        const dx=x-lx,dy=ledY-lensY,ang=Math.atan2(Math.abs(dx),dy);
        if(ang>halfBeam) return;
        let blocked=false;
        for(const wx of walls){
          if(wx<-20||wx>W+20) continue;
          if(Math.abs(dx)<0.5){if(Math.abs(wx-lx)<wallTPx/2){blocked=true;break;}continue;}
          const tw=(wx-lx)/dx;
          if(tw<=0.002||tw>=0.998) continue;
          const ry=ledY+tw*(lensY-ledY);
          if(ry>=lensY-0.5&&ry<=wallBotY+0.5){blocked=true;break;}
        }
        if(!blocked) tot+=bright[li]*Math.cos(ang)**2*(4500/(1+(dx*dx+dy*dy)*0.005));
      });
      illum[x]=tot;
    }
    let mx=0; for(let x=0;x<W;x++) if(illum[x]>mx) mx=illum[x];
    if(mx>0) for(let x=0;x<W;x++) illum[x]/=mx;

    leds.forEach((lx,li)=>{
      if(lx<-100||lx>W+100) return;
      const b=bright[li];
      for(let r=0;r<55;r++){
        const frac=r/54,ang=-halfBeam+frac*2*halfBeam,tx=lx+Math.tan(ang)*lensHPx;
        let tStop=1;
        for(const wx of walls){
          const dx=tx-lx; if(Math.abs(dx)<0.5) continue;
          const tw=(wx-lx)/dx; if(tw<=0.002||tw>=1) continue;
          const ry=ledY+tw*(lensY-ledY);
          if(ry>=lensY-0.5&&ry<=wallBotY+0.5&&tw<tStop) tStop=tw;
        }
        ctx.beginPath();ctx.moveTo(lx,ledY);ctx.lineTo(lx+tStop*(tx-lx),ledY+tStop*(lensY-ledY));
        ctx.strokeStyle=`rgba(255,210,100,${b*0.046*(1-Math.abs(frac-0.5)*0.75)})`;
        ctx.lineWidth=1;ctx.stroke();
      }
      const lxE=lx+Math.tan(-halfBeam)*lensHPx,rxE=lx+Math.tan(halfBeam)*lensHPx;
      const cg=ctx.createLinearGradient(lx,ledY,lx,lensY);
      cg.addColorStop(0,`rgba(255,175,55,${b*0.15})`);cg.addColorStop(1,`rgba(255,220,90,${b*0.025})`);
      ctx.beginPath();ctx.moveTo(lx,ledY);ctx.lineTo(lxE,lensY);ctx.lineTo(rxE,lensY);ctx.closePath();
      ctx.fillStyle=cg;ctx.fill();
    });

    const img=ctx.createImageData(W,diffH);
    for(let x=0;x<W;x++){
      const il=illum[x];
      for(let row=0;row<diffH;row++){
        const f=Math.pow(1-row/diffH,1.4),idx=(row*W+x)*4;
        img.data[idx]=Math.round(255*il*f);img.data[idx+1]=Math.round(220*il*f*0.88);
        img.data[idx+2]=Math.round(120*il*f*0.4);img.data[idx+3]=Math.round(250*il*f*0.9);
      }
    }
    ctx.putImageData(img,0,lensY-diffH);
    for(let x=0;x<W;x++){
      if(illum[x]<0.04) continue;
      const gl=ctx.createLinearGradient(x,lensY-5,x,lensY);
      gl.addColorStop(0,"rgba(255,236,150,0)");gl.addColorStop(1,`rgba(255,236,150,${illum[x]*0.52})`);
      ctx.fillStyle=gl;ctx.fillRect(x,lensY-5,1,5);
    }

    const pg=ctx.createLinearGradient(0,ledY+5,0,H);
    pg.addColorStop(0,"#111114");pg.addColorStop(1,"#0a0a0c");
    ctx.fillStyle=pg;ctx.fillRect(0,ledY+5,W,H-ledY-5);
    ctx.fillStyle="#2a2a32";ctx.fillRect(0,ledY+5,W,3);
    ctx.fillStyle="#2a2a32";ctx.fillRect(0,ledY+7,W,1);

    leds.forEach((lx,li)=>{
      if(lx<-30||lx>W+30) return;
      const b=bright[li];
      const halo=ctx.createRadialGradient(lx,ledY,0,lx,ledY,28);
      halo.addColorStop(0,`rgba(255,200,75,${b*0.5})`);halo.addColorStop(0.35,`rgba(255,140,35,${b*0.12})`);halo.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=halo;ctx.fillRect(lx-28,ledY-28,56,56);
      ctx.fillStyle="#16161a";ctx.fillRect(lx-5,ledY-4,10,8);
      const die=ctx.createRadialGradient(lx,ledY,0,lx,ledY,4.5);
      die.addColorStop(0,`rgba(255,255,240,${b})`);die.addColorStop(0.5,`rgba(255,230,130,${b*0.9})`);die.addColorStop(1,`rgba(255,155,35,${b*0.5})`);
      ctx.fillStyle=die;ctx.fillRect(lx-3.5,ledY-2.5,7,5);
    });

    walls.forEach(wx=>{
      if(wx<-6||wx>W+6) return;
      const hw=wallTPx/2;
      const wg=ctx.createLinearGradient(wx-hw,0,wx+hw,0);
      wg.addColorStop(0,"rgba(91,33,182,0.95)");wg.addColorStop(0.5,"rgba(124,58,237,0.97)");wg.addColorStop(1,"rgba(91,33,182,0.95)");
      ctx.fillStyle=wg;ctx.fillRect(wx-hw,lensY,wallTPx,wallHPx);
      ctx.strokeStyle="rgba(168,85,247,0.28)";ctx.lineWidth=0.5;ctx.strokeRect(wx-hw,lensY,wallTPx,wallHPx);
      const sg=ctx.createLinearGradient(wx,wallBotY,wx,wallBotY+12);
      sg.addColorStop(0,"rgba(0,0,0,0.26)");sg.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=sg;ctx.fillRect(wx-wallTPx*2,wallBotY,wallTPx*4,12);
    });

    const lg=ctx.createLinearGradient(0,lensY-3,0,lensY+5);
    lg.addColorStop(0,"rgba(6,182,212,0.12)");lg.addColorStop(0.5,"rgba(103,232,249,0.48)");lg.addColorStop(1,"rgba(6,182,212,0.06)");
    ctx.fillStyle=lg;ctx.fillRect(0,lensY-3,W,8);
    ctx.strokeStyle="rgba(6,182,212,0.86)";ctx.lineWidth=1.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(0,lensY);ctx.lineTo(W,lensY);ctx.stroke();
    ctx.strokeStyle="rgba(6,182,212,0.18)";ctx.lineWidth=1;
    for(let x=0;x<W;x+=16){ctx.beginPath();ctx.moveTo(x,lensY-2.5);ctx.lineTo(x,lensY+2.5);ctx.stroke();}

    const ax=W-20;
    ctx.strokeStyle="rgba(122,122,140,0.36)";ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(ax,ledY-2);ctx.lineTo(ax,lensY+2);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle="rgba(6,182,212,0.8)";ctx.font="bold 9px 'JetBrains Mono',ui-monospace,monospace";ctx.textAlign="right";
    ctx.fillText(`${p.lensHeight}mm (H)`,ax-3,(ledY+lensY)/2+3);
    dblArrow(ctx,ax,ledY-2,ax,lensY+2,"rgba(6,182,212,0.62)");
    if(wallHPx>12){
      ctx.strokeStyle="rgba(124,58,237,0.36)";ctx.lineWidth=1;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.moveTo(18,lensY);ctx.lineTo(18,wallBotY);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle="rgba(168,85,247,0.70)";ctx.textAlign="left";
      ctx.fillText(`${p.wallHeight}mm`,22,(lensY+wallBotY)/2+3);
    }
    ctx.textAlign="left";ctx.font="9px 'JetBrains Mono',ui-monospace,monospace";
    ctx.fillStyle="rgba(6,182,212,0.58)";ctx.fillText("◀ WHITE DIFFUSER ▶",W/2-68,lensY-9);
    ctx.fillStyle="rgba(255,200,95,0.48)";ctx.fillText("LED ARRAY",10,ledY-10);
    ctx.fillStyle="rgba(168,85,247,0.58)";ctx.fillText("WALLS",10,lensY+14);
    ctx.fillStyle="rgba(255,238,165,0.40)";ctx.fillText("▲ DIFFUSED OUTPUT",W/2-60,lensY-diffH-5);
    ctx.textAlign="left";
  }, [p]);

  useEffect(()=>{
    let stop=false;
    const loop=ts=>{if(stop)return;draw(ts);rafRef.current=requestAnimationFrame(loop);};
    rafRef.current=requestAnimationFrame(loop);
    return()=>{stop=true;cancelAnimationFrame(rafRef.current);};
  },[draw]);
  // ── Shared styles ────────────────────────────────────────────────────────
  const panel = { background:"#16161a", border:"1px solid #2a2a32", borderRadius:12, padding:"18px 20px", boxSizing:"border-box" };

  const rSt = rStat(ratio), dSt = dStat(depth), fSt = fStat(fill), bSt = beamOk?"good":"bad";
  const clSt = clStat(cc.clarity);

  const wobbleVerdict = ratio<0.08?"No visible wobble":ratio<0.2?"Subtle shimmer":ratio<=0.85?"Smooth wobble ✓":ratio<=1.4?"Busy / energetic":"> 1.4 chaotic";
  const clarityVerdict = cc.clarity>0.85?"Colors sharp & distinct":cc.clarity>0.65?"Minor neighbour mixing":cc.clarity>0.45?"Noticeable colour bleed":"Heavy colour mixing";

  return (
    <div style={{ background:"var(--bg-primary)", minHeight:"100vh", display:"flex", flexDirection:"row", alignItems:"stretch", fontFamily:"Inter, system-ui, sans-serif" }}>

      {/* ══ LEFT: canvas + analytics (scrolls) ══ */}
      <div className="wf-main" style={{ flex:"1 1 0", minWidth:0, overflowY:"auto", height:"100vh", display:"flex", flexDirection:"column", alignItems:"center", padding:"20px 16px 40px", gap:14 }}>

      {/* Header */}
      <div style={{ textAlign:"center" }}>
        <div style={{ fontSize:9, letterSpacing:"0.35em", color:"#7a7a8c", textTransform:"uppercase" }}>Optical Cross-Section Simulator</div>
        <h1 style={{ fontSize:18, fontWeight:700, margin:"3px 0 2px", letterSpacing:"0.09em", background:"linear-gradient(90deg,#a855f7,#e9d5ff,#a855f7)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", textTransform:"uppercase" }}>
          LED Grid Shadow Visualizer
        </h1>
        <div style={{ fontSize:9, color:"#7a7a8c", letterSpacing:"0.18em" }}>WLED DIFFUSER · WALL SHADOWS · WOBBLE & COLOUR CLARITY</div>
      </div>

      {/* Canvas */}
      <div style={{ border:"1px solid #182840", borderRadius:6, overflow:"hidden", maxWidth:"100%", boxShadow:"0 0 38px rgba(124,58,237,0.06),0 6px 55px rgba(0,0,0,0.75)" }}>
        <canvas ref={canvasRef} width={W} height={H} style={{ display:"block", maxWidth:"100%" }} />
      </div>

      {/* ── STEP 3: Dual analytics tiles ──────────────────────────────────── */}
      <div className="wf-tiles" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, width:"100%", maxWidth:860 }}>

        {/* LEFT: Wobble */}
        <div style={panel}>
          <Label>↔ Wobble Analysis</Label>

          {/* Zone strip — shift ratio IS the score, shown directly */}
          <RatioZoneStrip ratio={ratio} />

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:10 }}>
            <Metric label="Shadow Shift" value={isFinite(shift)?shift.toFixed(1):"∞"}     unit="mm"       status={rSt} />
            <Metric label="Wall Depth"   value={(depth*100).toFixed(0)}                   unit="% diff H" status={dSt} />
            <Metric label="Beam: have/need" value={`${(p.beamAngle/2).toFixed(0)}° / ${minAng.toFixed(0)}°`} unit="" status={bSt} />
            <Metric label="Wall Fill"    value={(fill*100).toFixed(0)}                    unit="% solid"  status={fSt} />
          </div>

          <BarGauge value={depth} status={dSt} label="Wall depth (target 15–45%)" />

          <div style={{ marginTop:8, background:"#111114", border:"1px solid #2a2a32", borderRadius:4, padding:"7px 10px", fontSize:9, color:"#7a7a8c", lineHeight:1.65 }}>
            <span style={{ color:C[rSt] }}>▸ </span>
            <span style={{ color:"#f0f0f5" }}>{wobbleVerdict}.</span>
            {!beamOk&&<span style={{ color:"#ef4444" }}> ⚠ Widen beam or reduce diffuser height for cross-illumination.</span>}
            {depth>0.5&&<span style={{ color:"#f59e0b" }}> ⚠ Walls &gt;50% diffuser height.</span>}
            <br/>
            <span style={{ color:"#7a7a8c" }}>Δ = ledSpacing({p.ledSpacing}) × wallH({p.wallHeight}) / (diffH({p.lensHeight})−wallH({p.wallHeight})) = </span>
            <span style={{ color:"#10b981" }}>{isFinite(shift)?shift.toFixed(2):"∞"} mm</span>
          </div>
        </div>

        {/* RIGHT: Colour Clarity */}
        <div style={panel}>
          <Label>🎨 Colour Clarity Analysis</Label>

          <div style={{ display:"flex", justifyContent:"center", marginBottom:10 }}>
            <ScoreDial score={cc.clarity} status={clSt} label="Colour Clarity" sublabel={clarityVerdict} />
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:10 }}>
            <Metric label="Clarity Score"   value={(cc.clarity*100).toFixed(0)}     unit="%"           status={clSt} />
            <Metric label="Neighbour Bleed" value={(cc.leakage*100).toFixed(0)}     unit="% leak"      status={cc.leakage<0.15?"good":cc.leakage<0.4?"warn":"bad"} />
            <Metric label="Beam Reach"      value={cc.effectiveBleed.toFixed(1)}    unit="mm reach"  status={cc.effectiveBleed<p.ledSpacing/2?"good":cc.effectiveBleed<p.ledSpacing?"warn":"bad"} />
            <Metric label="LEDs / Zone"     value={cc.numContrib.toFixed(1)}        unit="contributing" status={cc.numContrib<1.5?"good":cc.numContrib<2.5?"warn":"bad"} />
          </div>

          <BarGauge value={cc.clarity} status={clSt} label="Colour separation (100% = no mixing)" />
          <BarGauge value={Math.min(1,cc.effectiveBleed/p.ledSpacing)} status={cc.effectiveBleed<p.ledSpacing/2?"good":cc.effectiveBleed<p.ledSpacing?"warn":"bad"} label="Effective beam reach vs LED pitch" />

          <div style={{ marginTop:8, background:"#111114", border:"1px solid #2a2a32", borderRadius:4, padding:"7px 10px", fontSize:9, color:"#7a7a8c", lineHeight:1.65 }}>
            <span style={{ color:C[clSt] }}>▸ </span>
            <span style={{ color:"#f0f0f5" }}>{clarityVerdict}.</span>
            {cc.numContrib>2.5&&<span style={{ color:"#ef4444" }}> ⚠ {cc.numContrib.toFixed(1)} LEDs illuminate each zone — heavy colour blending.</span>}
            {cc.numContrib<=1.2&&<span style={{ color:"#10b981" }}> Each zone lit by ~1 LED.</span>}
            <br/>
            <span style={{ color:"#7a7a8c" }}>Effective reach at diffuser: </span>
            <span style={{ color:"#a855f7" }}>{cc.effectiveBleed.toFixed(1)} mm</span>
            <span style={{ color:"#7a7a8c" }}> vs LED pitch </span>
            <span style={{ color:"#a855f7" }}>{p.ledSpacing} mm</span>
            {cc.wallBleed<cc.beamBleed&&<span style={{ color:"#7a7a8c" }}> (walls clip beam reach: {cc.beamBleed.toFixed(1)}→{cc.effectiveBleed.toFixed(1)} mm)</span>}
          </div>

          <details style={{ marginTop:8 }}>
            <summary style={{ fontSize:8, color:"#7a7a8c", letterSpacing:"0.12em", textTransform:"uppercase", cursor:"pointer" }}>▸ How colour clarity is calculated</summary>
            <div style={{ marginTop:7, fontSize:9, color:"#7a7a8c", lineHeight:1.7, background:"#111114", border:"1px solid #2a2a32", borderRadius:4, padding:"9px 11px" }}>
              <p style={{ margin:"0 0 6px" }}>
                <span style={{ color:"#c4b5fd" }}>Why farther diffuser = worse clarity:</span> from the centre of a wall gap on the white diffuser, a ray to an LED at horizontal offset dx passes through the gap only if it clears the wall tips — which requires <em>dx &lt; (wallGap/2) × diffuserH / wallH</em>. This reach grows linearly with diffuser height, so raising the diffuser admits more LEDs per zone and mixes more colours.
              </p>
              <p style={{ margin:"0 0 6px" }}>
                <span style={{ color:"#c4b5fd" }}>Two limits:</span> effective reach = min(beam reach, wall slit reach) = min(tan(halfBeam) × diffH, wallGap/2 × diffH / wallH). Beam angle caps it when the slit is wide; deep narrow walls cap it when the slit is tight.
              </p>
              <p style={{ margin:0 }}>
                <span style={{ color:"#c4b5fd" }}>Score = </span><em>min(1, ledSpacing / (2 × effectiveReach))</em>. 100% = each gap lit by 1 LED only. Taller walls help clarity but reduce wobble cross-illumination — the left tile shows that tradeoff live.
              </p>
            </div>
          </details>
        </div>
      </div>

      {/* Legend */}
      <div style={{ display:"flex", gap:16, fontSize:9, color:"#7a7a8c", flexWrap:"wrap", justifyContent:"center" }}>
        {[["rgba(255,210,95,0.8)","LED light cone"],["rgba(6,182,212,0.8)","White diffuser"],["rgba(124,58,237,0.8)","Shadow walls"],["rgba(255,238,155,0.8)","Diffused output"]].map(([c,l])=>(
          <div key={l} style={{ display:"flex", alignItems:"center", gap:5 }}>
            <div style={{ width:9,height:9,background:c,borderRadius:2 }} />
            <span>{l}</span>
          </div>
        ))}
      </div>

      </div>{/* ══ end LEFT ══ */}

      {/* ══ RIGHT: sticky control pane ══ */}
      <div className="wf-pane" style={{
        flex:"0 0 340px", width:340, height:"100vh", overflowY:"auto",
        background:"#111114", borderLeft:"1px solid #2a2a32",
        padding:"18px 16px 40px", display:"flex", flexDirection:"column", gap:12,
      }}>
        <div style={{ fontSize:9, letterSpacing:"0.28em", color:"#7a7a8c", textTransform:"uppercase", paddingBottom:4, borderBottom:"1px solid #2a2a32" }}>
          Controls
        </div>
      {/* ── STEP 1: Fixed Parameters ───────────────────────────────────────── */}
      <div style={{ ...panel, width:"100%" }}>
        <Label>① Fixed Parameters — enter your hardware values</Label>

        {/* LED preset */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:9, color:"#7a7a8c", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:6 }}>LED type → beam angle</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
            {LED_PRESETS.map((pr,i)=>(
              <button key={i} onClick={()=>selectPreset(i)} title={pr.note} style={{
                background: fixed.presetIdx===i?"rgba(124,58,237,0.18)":"rgba(17,17,20,0.8)",
                border:`1px solid ${fixed.presetIdx===i?"#a855f7":"#2a2a32"}`,
                color: fixed.presetIdx===i?"#c4b5fd":"#7a7a8c",
                borderRadius:4, padding:"5px 10px", cursor:"pointer",
                fontSize:10, letterSpacing:"0.05em", transition:"all 0.15s",
              }}>
                {pr.name}{pr.angle?<span style={{ marginLeft:5, opacity:0.6, fontSize:9 }}>{pr.angle}°</span>:null}
              </button>
            ))}
          </div>
          {fixed.presetIdx === LED_PRESETS.length-1 && (
            <div style={{ marginTop:8 }}>
              <NumField label="Custom Beam Angle" value={fixed.beamAngle} min={10} max={170} step={5} onChange={setF("beamAngle")} unit="°" />
            </div>
          )}
          {fixed.presetIdx < LED_PRESETS.length-1 && (
            <div style={{ marginTop:6, fontSize:9, color:"#7a7a8c" }}>
              {LED_PRESETS[fixed.presetIdx].note} · beam angle locked to <span style={{ color:"#a855f7" }}>{fixed.beamAngle}°</span>
            </div>
          )}
        </div>

        {/* Three fixed inputs */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:"12px 24px" }}>
          <NumField label="LED Spacing" value={fixed.ledSpacing} min={5} max={60} step={0.5} onChange={setF("ledSpacing")} unit=" mm" />
          <NumField label="Wall Gap (open)"  value={fixed.wallGap}   min={1} max={30} step={0.5} onChange={setF("wallGap")}   unit=" mm" />
          <NumField label="Wall Thickness"   value={fixed.wallThickness} min={0.3} max={4} step={0.1} onChange={setF("wallThickness")} unit=" mm" />
        </div>

        <div style={{ marginTop:10, display:"flex", gap:16, flexWrap:"wrap" }}>
          <div style={{ fontSize:9, color:"#7a7a8c" }}>Wall pitch: <span style={{ color:"#a855f7" }}>{(fixed.wallGap+fixed.wallThickness).toFixed(1)} mm</span></div>
          <div style={{ fontSize:9, color:"#7a7a8c" }}>Solid fill: <span style={{ color:C[fSt] }}>{(solidFill(fixed)*100).toFixed(0)}%</span> {fSt==="bad"?"⚠ too dense":""}</div>
          <div style={{ fontSize:9, color:"#7a7a8c" }}>Beam half-angle: <span style={{ color:"#a855f7" }}>{(fixed.beamAngle/2).toFixed(0)}°</span></div>
        </div>
      </div>

      {/* ── STEP 2: Variable heights ───────────────────────────────────────── */}
      <div style={{ ...panel, width:"100%" }}>
        <Label>② Adjust heights — diffuser height and wall height</Label>
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <HeightSlider label="Diffuser Height" value={heights.lensHeight} min={5} max={85} step={1} onChange={setH("lensHeight")} unit=" mm" />
          <HeightSlider label="Wall Height" value={heights.wallHeight} min={1} max={Math.max(2,heights.lensHeight-2)} step={0.5} onChange={setH("wallHeight")} unit=" mm" />
        </div>
        <div style={{ marginTop:10, display:"flex", gap:10, flexWrap:"wrap" }}>
          <button onClick={()=>{ const o=suggestOptimal(p); setFixed(f=>({...f,wallGap:o.wallGap,wallThickness:o.wallThickness})); setHeights(h=>({...h,wallHeight:o.wallHeight})); }}
            style={{ background:"rgba(16,185,129,0.12)", border:"1px solid #10b98144", color:"#10b981", borderRadius:4, padding:"5px 14px", cursor:"pointer", fontSize:10, letterSpacing:"0.12em", textTransform:"uppercase" }}>
            ✦ Auto-Optimize
          </button>
          <button onClick={()=>{setFixed({ledSpacing:DEFAULTS.ledSpacing,wallGap:DEFAULTS.wallGap,wallThickness:DEFAULTS.wallThickness,beamAngle:DEFAULTS.beamAngle,presetIdx:DEFAULTS.presetIdx});setHeights({lensHeight:DEFAULTS.lensHeight,wallHeight:DEFAULTS.wallHeight});}}
            style={{ background:"#111114", border:"1px solid #2a2a32", color:"#7a7a8c", borderRadius:4, padding:"5px 14px", cursor:"pointer", fontSize:10, letterSpacing:"0.12em", textTransform:"uppercase" }}>
            Reset
          </button>
        </div>
      </div>
      </div>{/* ══ end RIGHT ══ */}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
